<meta name="site-base" content="">
<script>/* GitHub Pages serves this file for any missing URL, so relative assets need a <base>.
   Works for user sites (name.github.io) and project sites (name.github.io/repo/).
   If you use a custom path layout, set <meta name="site-base" content="/your/base/"> instead. */
(function(){var m=document.querySelector('meta[name="site-base"]');var b='/';
if(m&&m.content){b=m.content;}else{var seg=location.pathname.split('/').filter(Boolean);
if(location.hostname.slice(-10)==='.github.io'&&seg.length>1){b='/'+seg[0]+'/';}}
document.write('<base href="'+b+'">');})();</script>
