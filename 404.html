<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:17px/1.6 system-ui,sans-serif;background:#f5f1ea;color:#15171b;text-align:center;padding:24px}
h1{font:600 3rem/1 Georgia,serif;margin:0 0 12px}a{display:inline-block;margin-top:18px;background:#e4572e;color:#fff;padding:12px 22px;border-radius:99px;text-decoration:none;font-weight:700}</style></head>
<body><div><h1>404</h1><p>That page doesn't exist or has moved.</p><a id="home" href="./">Go to the homepage</a></div>
<script>/* works for both user sites and /repo/ project sites */
var seg=location.pathname.split('/').filter(Boolean);
if(location.hostname.endsWith('.github.io')&&seg.length>1){document.getElementById('home').href='/'+seg[0]+'/';}else{document.getElementById('home').href='/';}</script>
</body></html>
